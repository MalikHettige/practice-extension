<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SVG Viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .bar { display: flex; gap: 8px; padding: 10px; background: #222; }
    .bar button { padding: 6px 12px; cursor: pointer; }
    #stage { display: flex; align-items: center; justify-content: center;
             height: calc(100vh - 54px); background: #fff; }
    #stage[data-bg="light"] { background: #fff; }
    #stage[data-bg="dark"] { background: #111; }
    #stage[data-bg="checker"] {
      background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 20px 20px;
    }
    #svg { width: 256px; height: 256px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="bar">
    <button data-bg="light">Light</button>
    <button data-bg="dark">Dark</button>
    <button data-bg="checker">Checker</button>
    <button id="download">Download .svg</button>
    <button id="copy">Copy markup</button>
  </div>
  <div id="stage" data-bg="light">
    <img id="svg" alt="Selected SVG">
  </div>
  <script src="viewer.js"></script>
</body>
</html>
